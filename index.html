<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8B5CF6">
    <title>Outfit Finder</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👗</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Outfit Finder</h1>
            <p class="tagline">Type the outfit in your head. Get every piece, and where to order it.</p>
        </header>

        <main>
            <form id="outfit-form" class="input-card">
                <label for="outfit-description" class="sr-only">Describe your outfit</label>
                <textarea
                    id="outfit-description"
                    maxlength="1000"
                    rows="3"
                    placeholder="e.g. oversized cream sweater, high-waisted jeans and brown ankle boots for a cozy fall day"
                ></textarea>

                <fieldset class="budget">
                    <legend>Budget</legend>
                    <label><input type="radio" name="budget" value="budget"><span>$ Affordable</span></label>
                    <label><input type="radio" name="budget" value="mid" checked><span>$$ Mid-range</span></label>
                    <label><input type="radio" name="budget" value="splurge"><span>$$$ Splurge</span></label>
                </fieldset>

                <button id="find-outfits" type="submit" class="primary-btn">Find My Outfit</button>
            </form>

            <div class="chip-row" aria-label="Outfit ideas">
                <span class="label">Try:</span>
                <button type="button" class="chip" data-style="casual weekend brunch outfit with straight-leg jeans and a cute top">Casual Brunch</button>
                <button type="button" class="chip" data-style="elegant date night dress in black or burgundy with heels">Date Night</button>
                <button type="button" class="chip" data-style="modern work outfit with a tailored blazer and wide-leg trousers">Work Chic</button>
                <button type="button" class="chip" data-style="matching athleisure set that is comfy but put together">Athleisure</button>
                <button type="button" class="chip" data-style="summer wedding guest outfit, flowy midi dress in a soft color">Wedding Guest</button>
                <button type="button" class="chip" data-style="beach vacation outfit with linen pants and a breezy top">Vacation</button>
            </div>

            <div id="recents" class="chip-row hidden" aria-label="Recent searches">
                <span class="label">Recent:</span>
            </div>

            <section id="status" class="status hidden" role="status" aria-live="polite"></section>

            <section id="results" class="results hidden">
                <div class="results-header">
                    <h2>Your Outfit</h2>
                    <p id="summary" class="summary"></p>
                    <p id="notice" class="notice hidden"></p>
                </div>
                <div id="pieces" class="pieces"></div>
            </section>
        </main>

        <footer>
            <p>Made with love</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
